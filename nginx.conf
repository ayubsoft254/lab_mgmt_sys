server {
    listen 80;
    server_name ictlabs.ttu.ac.ke;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ictlabs.ttu.ac.ke;

    # SSL Certificates (update paths after running certbot)
    ssl_certificate /etc/letsencrypt/live/ictlabs.ttu.ac.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ictlabs.ttu.ac.ke/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Logging
    access_log /var/log/nginx/ictlabs.access.log;
    error_log /var/log/nginx/ictlabs.error.log;

    # Max upload size (adjust for your lab file uploads)
    client_max_body_size 50M;

    # Static files — proxied to Django/Gunicorn
    location /static/ {
        proxy_pass http://127.0.0.1:7557;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files — user uploaded content
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy all other requests to Django/Gunicorn
    location / {
        proxy_pass http://127.0.0.1:7557;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Django CSRF with HTTPS
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}